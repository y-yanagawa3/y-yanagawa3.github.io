<main class="work-detail">

  <!-- ヘッダー -->
  <header class="work-detail__header">
    <h1 class="work-detail__title" id="work-title">Project Title</h1>

    <div class="work-detail__meta">
      <!-- project-type -->
      <div class="work-detail__meta-item">
        <span class="value tag-style" id="work-project-type">自主制作</span>
      </div>
      <!-- Category -->
      <div class="work-detail__meta-item">
        <span class="label">Category :</span>
        <span class="value work-detail__category" id="work-category">Web / Banner</span>
      </div>
      <!-- Service -->
      <div class="work-detail__meta-item">
        <span class="label">Service :</span>
        <span class="value work-detail__service" id="work-service">Coding / Design</span>
      </div>
      <!-- URL -->
      <div class="work-detail__meta-item" id="work-url-wrapper">
        <span class="label">URL :</span>
        <a href="" class="value work-detail__url" id="work-url" target="_blank" rel="noopener noreferrer">View Site</a>
        <i class="fa-solid fa-arrow-up-right-from-square work-detail__url-icon" id="work-url-icon"></i>
      </div>
      <!-- GitHub -->
      <div class="work-detail__meta-item" id="work-code-wrapper">
        <span class="label">Code :</span>
        <a href="" class="value work-detail__url" id="work-code" target="_blank" rel="noopener noreferrer">View Code</a>
        <i class="fa-solid fa-arrow-up-right-from-square work-detail__url-icon" id="work-code-icon"></i>
      </div>

    </div>
  </header>

  <!-- メインビジュアル -->
  <section class="work-detail__main-view">
    <div class="work-detail__image-wrapper">
      <img src="" id="work-image" alt="">
    </div>
  </section>

  <!-- 概要等 -->
  <section class="work-detail__content section-container">

    <div class="work-detail__main bento-item">

      <div class="work-detail__section">
        <div class="work-detail__section-flex">
          <div class="work-detail__title-wrapper">
            <h2 class="work-detail__section-title">Overview</h2>
            <span class="work-detail__section-subtitle">概要</span>
          </div>
          <p class="work-detail__text" id="work-overview">
            ここに作品の概要を記述。
          </p>
        </div>
      </div>

      <div class="work-detail__section">
        <div class="work-detail__section-flex">
          <div class="work-detail__title-wrapper">
            <h2 class="work-detail__section-title">Objective</h2>
            <span class="work-detail__section-subtitle">目的</span>
          </div>
          <p class="work-detail__text" id="work-objective"></p>
        </div>
      </div>

      <div class="work-detail__section">
        <div class="work-detail__section-flex">
          <div class="work-detail__title-wrapper">
            <h2 class="work-detail__section-title">Target</h2>
            <span class="work-detail__section-subtitle">ターゲット</span>
          </div>
          <p class="work-detail__text" id="work-target"></p>
        </div>
      </div>

      <div class="work-detail__section">
        <div class="work-detail__section-flex">
          <div class="work-detail__title-wrapper">
            <h2 class="work-detail__section-title">Point</h2>
            <span class="work-detail__section-subtitle">ポイント</span>
          </div>
          <p class="work-detail__text" id="work-point">
            こだわった点など。
          </p>
        </div>
      </div>

      <div class="work-detail__section">
        <div class="work-detail__section-flex">
          <div class="work-detail__title-wrapper">
            <h2 class="work-detail__section-title">Tools</h2>
            <span class="work-detail__section-subtitle">使用ツール</span>
          </div>
          <p class="work-detail__text" id="work-tools"></p>
        </div>
      </div>

      <div class="work-detail__section" id="work-tech-wrapper">
        <div class="work-detail__section-flex">
          <div class="work-detail__title-wrapper">
            <h2 class="work-detail__section-title">Tech Stack</h2>
            <span class="work-detail__section-subtitle">使用技術</span>
          </div>
          <p class="work-detail__text" id="work-tech"></p>
        </div>
      </div>

      <div class="work-detail__section">
        <div class="work-detail__section-flex">
          <div class="work-detail__title-wrapper">
            <h2 class="work-detail__section-title">Duration</h2>
            <span class="work-detail__section-subtitle">期間</span>
          </div>
          <p class="work-detail__text" id="work-duration"></p>
        </div>
      </div>

    </div>



    <div class="work-detail__back">
      <a href="index.html" onclick="history.back(); return false;" class="work-detail__back-link">← Back to Works</a>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="footer__container">
    <small class="footer__copyright">&copy; 2026 YANAGAWA PORTFOLIO. All Rights Reserved.</small>
  </div>
</footer>
